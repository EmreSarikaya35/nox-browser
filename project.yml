name: NOX
options:
  developmentLanguage: en # Türkçe olmayan her sistem dilinde İngilizce kullanılır
  bundleIdPrefix: com.nox
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
targets:
  NOX:
    type: application
    platform: macOS
    sources:
      - NOX
      - path: SpiritQuest # gömülü oyun; klasör olduğu gibi Resources/SpiritQuest'e kopyalanır
        type: folder
        buildPhase: resources
    info:
      path: NOX/Info.plist
      properties:
        # http/https bağlantılarını açabildiğini bildirir: Sistem Ayarları'nda varsayılan tarayıcı olarak seçilebilir.
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSItemContentTypes: [public.html, public.xhtml]
    entitlements:
      path: NOX/NOX.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: NOX
        PRODUCT_BUNDLE_IDENTIFIER: com.nox.browser
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NOX Browser
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSCameraUsageDescription: Web siteleri izninizle kamerayı kullanabilir.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Web siteleri izninizle mikrofonu kullanabilir.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          ONLY_ACTIVE_ARCH: NO
  NOXTests:
    type: bundle.unit-test
    platform: macOS
    sources: [NOXTests]
    dependencies:
      - target: NOX
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NOX:
    build:
      targets:
        NOX: all
    test:
      targets: [NOXTests]
      language: tr # testler Türkçe kaynak metinlere göre yazıldı
